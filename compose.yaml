services:
  app:
    build: .
    ports:
      - "8088:8080"
    environment:
      DATABASE_URL: cockroachdb+psycopg://steward:cloud-steward-local-only@cockroach:26257/cloud_steward?sslmode=require
      DATAHUB_GMS_URL: ${DATAHUB_GMS_URL:-}
      DATAHUB_GMS_TOKEN: ${DATAHUB_GMS_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      cockroach:
        condition: service_healthy

  cockroach:
    image: cockroachdb/cockroach:v26.2.0
    hostname: cockroach
    command: start-single-node --accept-sql-without-tls --http-addr=cockroach:8080
    environment:
      COCKROACH_DATABASE: cloud_steward
      COCKROACH_USER: steward
      COCKROACH_PASSWORD: cloud-steward-local-only
    ports:
      - "26257:26257"
      - "8089:8080"
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test:
        - CMD-SHELL
        - cockroach sql --url='postgresql://steward:cloud-steward-local-only@127.0.0.1:26257/cloud_steward?sslmode=require' -e 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 4s
      retries: 12

volumes:
  cockroach-data:
