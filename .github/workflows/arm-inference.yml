name: Native Arm inference

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/arm-inference.yml"
      - "deploy/arm_inference_smoke.py"
      - "deploy/run_arm_inference_benchmark.sh"
      - "deploy/summarize_arm_inference.py"
      - "src/cloud_steward/local_inference.py"
      - "src/cloud_steward/planner.py"
      - "src/cloud_steward/settings.py"

permissions:
  contents: read

jobs:
  benchmark:
    name: Qwen FP16 vs Q4_0 + KleidiAI
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake curl ninja-build time
          pip install -e .
      - name: Run native Arm64 inference benchmark
        env:
          ARM_BENCH_THREADS: "4"
        run: bash deploy/run_arm_inference_benchmark.sh
      - name: Publish benchmark summary
        run: cat artifacts/arm-inference/benchmark-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-llama-kleidiai-evidence
          path: artifacts/arm-inference
          if-no-files-found: error
          retention-days: 90